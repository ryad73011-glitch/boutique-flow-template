name: Deploy boutique demo to GitHub Pages

on:
  push:
    branches:
      - feat/sales-ready-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static demo
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_STORE_NAME: 'MAISON EL DJAZAIR — DEMO'
          VITE_STORE_NAME_AR: 'دار الجزائر — نسخة تجريبية'
          VITE_STORE_TAGLINE_FR: 'DÉMONSTRATION — DONNÉES FICTIVES'
          VITE_STORE_TAGLINE_AR: 'عرض تجريبي — بيانات غير حقيقية'
          VITE_WHATSAPP_PHONE: '213555123456'
          VITE_ATELIER_PHONE: '+213 555 123 456'
          VITE_ATELIER_ADDRESS_FR: 'Adresse de démonstration — à remplacer'
          VITE_ATELIER_ADDRESS_AR: 'عنوان تجريبي — يجب تغييره'
          VITE_ATELIER_HOURS_FR: 'Horaires fictifs — à confirmer'
          VITE_ATELIER_HOURS_AR: 'أوقات تجريبية — يجب تأكيدها'
      - name: Verify static output
        run: test -s dist/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
